[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosight"
version = "0.2.0"
description = "Motion detection library using fly optic lobe architecture (VFB connectome). Lightweight, CPU-friendly, biologically grounded."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "CodeForgeNet"}
]
requires-python = ">=3.10"
keywords = ["motion-detection", "neuroscience", "fly-brain", "connectome", "computer-vision", "edge-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "ruff>=0.4",
    "mypy>=1.0",
]
neuprint = [
    "neuprint-python>=0.4.23",
]

[project.urls]
Homepage = "https://github.com/CodeForgeNet/neurosight"
Documentation = "https://github.com/CodeForgeNet/neurosight#readme"
Repository = "https://github.com/CodeForgeNet/neurosight"
"Bug Tracker" = "https://github.com/CodeForgeNet/neurosight/issues"

[tool.setuptools]
packages = ["neurosight", "neurosight.data"]

[tool.setuptools.package-data]
"neurosight" = ["py.typed"]
"neurosight.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
# Ensure the repository root is importable regardless of how pytest is invoked
# (e.g. the `pytest` console script does not add the CWD to sys.path, unlike
# `python -m pytest`). Tests import helpers from the top-level `benchmarks/`.
pythonpath = ["."]

[tool.coverage.run]
source = ["neurosight"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
