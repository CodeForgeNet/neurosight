name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check neurosight tests benchmarks
      - name: Type check (mypy)
        run: mypy neurosight
      - name: Test with coverage
        run: pytest --cov=neurosight --cov-report=term-missing --cov-fail-under=80

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Check for macOS metadata in artifacts
        run: |
          if unzip -l dist/*.whl | grep -q '\._'; then
            echo "AppleDouble files found in wheel" >&2
            exit 1
          fi
          if tar tzf dist/*.tar.gz | grep -q '\._'; then
            echo "AppleDouble files found in sdist" >&2
            exit 1
          fi
      - name: Install wheel and smoke test
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python -c "import neurosight; from neurosight import NeuroSightDetector, MotionDetector; print('neurosight', neurosight.__version__)"
